# Élysée 2027 : service NAS (API) + tunnel Cloudflare sortant.
# Aucun port n'est publié sur le NAS : seul le tunnel, qui établit lui-même la connexion vers
# Cloudflare, atteint l'API. L'adresse IP de votre domicile n'est jamais exposée.
services:
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    # Identifiant de l'utilisateur DSM qui possède ./data (commande « id » en SSH). Voir README.
    user: "${PUID:-1000}:${PGID:-1000}"
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 100
    # Aucun journal : le service n'écrit déjà rien sur les requêtes ; on évite aussi ceux de Docker.
    logging:
      driver: none
    networks: [interne]

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate --loglevel warn run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on: [api]
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options: { max-size: "1m", max-file: "1" }
    networks: [interne]

networks:
  interne: {}

<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Relecture · Élysée 2027</title>
<style>
:root { --bg:#f6f5f1; --card:#fff; --ink:#1c2230; --mut:#5d6677; --line:#d9d6cc; --ok:#1d7a46; --ko:#b3261e; --mid:#a86a00; --acc:#1f3a8a; }
@media (prefers-color-scheme: dark) { :root { --bg:#14171f; --card:#1d212c; --ink:#e8eaf0; --mut:#98a1b3; --line:#343a49; --ok:#4cc27f; --ko:#ff8a80; --mid:#e0a43a; --acc:#8fa8ff; } }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui, sans-serif; }
main { max-width: 760px; margin: 0 auto; padding: 12px 16px 120px; }
h1 { font-size: 20px; margin: 8px 0; }
.bar { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 8px 0; border-bottom: 1px solid var(--line); }
.row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
button, select, input, textarea { font: inherit; color: inherit; }
button { border:1px solid var(--line); background: var(--card); border-radius: 8px; padding: 8px 12px; cursor: pointer; min-height: 44px; }
button.primary { background: var(--acc); color:#fff; border-color: var(--acc); }
button[aria-pressed="true"].v { background: var(--ok); color:#fff; border-color: var(--ok); }
button[aria-pressed="true"].c { background: var(--mid); color:#fff; border-color: var(--mid); }
button[aria-pressed="true"].r { background: var(--ko); color:#fff; border-color: var(--ko); }
select, textarea, input[type=text] { border:1px solid var(--line); background: var(--card); border-radius: 8px; padding: 8px; width: 100%; }
select { width: auto; max-width: 100%; min-height: 44px; }
#jump { flex: 1 1 100%; min-width: 0; }
blockquote, .enonce, .muted { overflow-wrap: anywhere; }
code { overflow-wrap: anywhere; }
textarea { min-height: 60px; }
.prog { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-top: 8px; }
.prog i { display:block; height:100%; background: var(--ok); }
.card { background: var(--card); border:1px solid var(--line); border-radius: 12px; padding: 14px; margin: 12px 0; }
.card.done { border-left: 6px solid var(--ok); }
.card.rej { border-left: 6px solid var(--ko); }
.card.cor { border-left: 6px solid var(--mid); }
.muted { color: var(--mut); font-size: 14px; }
.tag { display:inline-block; font-size:12px; border:1px solid var(--line); border-radius:99px; padding:1px 8px; color:var(--mut); }
.enonce { font-size: 19px; font-weight: 600; margin: 6px 0; }
blockquote { margin: 8px 0; padding: 6px 10px; border-left: 3px solid var(--line); background: color-mix(in srgb, var(--bg) 60%, transparent); }
.sw { display:inline-block; width:12px; height:12px; border-radius:50%; margin-right:6px; vertical-align:-1px; }
a { color: var(--acc); }
.hide { display:none; }
details summary { cursor:pointer; }
</style>
</head>
<body>
<main>
<div class="bar">
  <h1>Relecture des questions</h1>
  <div class="row">
    <button id="prev">← Précédente</button>
    <select id="jump" aria-label="Aller à une question"></select>
    <button id="next" class="primary">Suivante →</button>
    <select id="filter" aria-label="Filtre">
      <option value="all">Toutes</option>
      <option value="todo">À relire</option>
      <option value="done">Relues</option>
      <option value="flag">Avec corrections ou rejets</option>
    </select>
  </div>
  <div class="muted" id="count"></div>
  <div class="prog"><i id="progbar" style="width:0"></i></div>
</div>
<div id="view"></div>
<div class="card">
  <h2 style="font-size:17px;margin-top:0">Enregistrer</h2>
  <p class="muted">Vos décisions sont gardées dans ce navigateur (rien n'est envoyé). Exportez le fichier, placez-le dans <code>data/relecture.json</code>, puis lancez <code>python3 tools/apply_relecture.py</code>.</p>
  <div class="row">
    <button id="export" class="primary">Exporter relecture.json</button>
    <button id="import">Importer…</button>
    <input type="file" id="file" accept="application/json" class="hide">
  </div>
  <p class="muted" id="saved"></p>
</div>
</main>
<script>
const KEY = 'e2027.relecture.v1';
const SCORE = { 2: 'Pour, nettement', 1: 'Plutôt pour', 0: 'Neutre ou mixte', '-1': 'Plutôt contre', '-2': 'Contre, nettement' };
const NIV = { programme: 'Programme', candidat: 'Déclaration du candidat', proche: 'Déclaration d’un proche' };
let Q = [], P = [], C = {}, A = {}, S = { dec: {}, cur: 0 };
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || null; } catch { return null; } };
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); document.getElementById('saved').textContent = 'Enregistré dans ce navigateur à ' + new Date().toLocaleTimeString('fr-FR'); } catch { document.getElementById('saved').textContent = 'Stockage local indisponible : exportez régulièrement.'; } };

const dq = (id) => (S.dec[id] ||= { question: null, enonce: '', note: '', positions: {} });
const posOf = (id) => P.filter((p) => p.question === id).sort((a, b) => (C[a.candidat]?.nom || '').localeCompare(C[b.candidat]?.nom || '', 'fr'));
const isDone = (id) => { const d = S.dec[id]; return !!d && !!d.question && posOf(id).every((p) => d.positions[p.candidat]?.statut); };
const isFlag = (id) => { const d = S.dec[id]; return !!d && (d.question === 'reformuler' || Object.values(d.positions).some((x) => x.statut === 'corrige' || x.statut === 'rejete')); };
const list = () => { const f = document.getElementById('filter').value; return Q.filter((q) => f === 'all' || (f === 'todo' && !isDone(q.id)) || (f === 'done' && isDone(q.id)) || (f === 'flag' && isFlag(q.id))); };

function posCard(p) {
  const d = dq(p.question).positions[p.candidat] || {};
  const c = C[p.candidat] || { nom: p.candidat, couleur: '#888' };
  const st = d.statut;
  const sc = d.score ?? p.score;
  return `<div class="card ${st === 'valide' ? 'done' : st === 'rejete' ? 'rej' : st === 'corrige' ? 'cor' : ''}" data-c="${esc(p.candidat)}">
    <div><span class="sw" style="background:${esc(c.couleur)}"></span><b>${esc(c.nom)}</b> <span class="tag">${esc(NIV[p.niveau] || p.niveau)}</span></div>
    <div style="margin-top:4px">Position retenue : <b>${esc(SCORE[sc])}</b> (${sc > 0 ? '+' : ''}${sc})${d.score !== undefined && d.score !== p.score ? ` <span class="tag">proposé : ${p.score > 0 ? '+' : ''}${p.score}</span>` : ''}</div>
    ${p.niveau === 'silence' ? `<blockquote><b>Déduit du silence.</b> « ${esc(p.recherche.sujet)} » n'apparaît dans aucune des ${p.recherche.fichiers} pages de son programme (${Math.round(p.recherche.caracteres / 1000)} 000 car.). À valider seulement si ce programme est bien complet.</blockquote>` : `<blockquote>« ${esc(p.citation)} »</blockquote>`}
    <div class="muted"><a href="${esc(p.source.url)}" target="_blank" rel="noopener noreferrer">Ouvrir la source</a>${p.source.media ? ' · ' + esc(p.source.media) : ''} · consultée le ${esc(p.source.consulte)}${p.note ? ' · note : ' + esc(p.note) : ''}</div>
    <div class="row" style="margin-top:8px" role="group" aria-label="Décision">
      <button class="v" data-act="valide" aria-pressed="${st === 'valide'}">Valider</button>
      <button class="c" data-act="corrige" aria-pressed="${st === 'corrige'}">Corriger</button>
      <button class="r" data-act="rejete" aria-pressed="${st === 'rejete'}">Rejeter</button>
    </div>
    <div class="${st === 'corrige' || st === 'rejete' || d.note ? '' : 'hide'}" style="margin-top:8px">
      <div class="${st === 'corrige' ? '' : 'hide'} row" style="margin-bottom:6px">
        <label>Position correcte :
          <select data-f="score">${[2, 1, 0, -1, -2].map((v) => `<option value="${v}" ${v === sc ? 'selected' : ''}>${v > 0 ? '+' : ''}${v} · ${SCORE[v]}</option>`).join('')}</select>
        </label>
      </div>
      <textarea data-f="note" placeholder="Motif ou commentaire (facultatif)">${esc(d.note || '')}</textarea>
    </div>
  </div>`;
}

function render() {
  const L = list(), view = document.getElementById('view');
  const done = Q.filter((q) => isDone(q.id)).length;
  document.getElementById('count').textContent = `${done} question(s) relue(s) sur ${Q.length} · ${L.length} affichée(s) avec ce filtre`;
  document.getElementById('progbar').style.width = (Q.length ? 100 * done / Q.length : 0) + '%';
  const jump = document.getElementById('jump');
  jump.innerHTML = L.map((q, i) => `<option value="${i}">${isDone(q.id) ? '✓ ' : ''}${esc(q.id)} · ${esc((q.enonce || '').slice(0, 48))}…</option>`).join('');
  if (!L.length) { view.innerHTML = '<div class="card">Aucune question pour ce filtre.</div>'; return; }
  S.cur = Math.min(Math.max(S.cur, 0), L.length - 1);
  jump.value = S.cur;
  const q = L[S.cur], ps = posOf(q.id), d = dq(q.id);
  const axe = q.axe ? (A[q.axe]?.nom || q.axe) : (q.theme || 'Hors graphe');
  const sens = q.axe && A[q.axe] ? (q.sens > 0 ? `Un accord pousse vers « ${A[q.axe].pole2 || A[q.axe].poleB || A[q.axe].poles?.[1] || 'second pôle'} »` : `Un accord pousse vers « ${A[q.axe].pole1 || A[q.axe].poleA || A[q.axe].poles?.[0] || 'premier pôle'} »`) : 'Hors graphe';
  view.innerHTML = `
  <div class="card ${d.question === 'ok' ? 'done' : d.question === 'reformuler' ? 'cor' : ''}">
    <div class="muted">${esc(q.id)} · ${esc(axe)} · ${ps.length} position(s) · <span class="tag">${esc(sens)}</span>${q.actualite ? ' · <span class="tag">actualité, jusqu’au ' + esc(q.actualite.jusqu_au) + '</span>' : ''}</div>
    <div class="enonce">« ${esc(q.enonce)} »</div>
    <div class="muted">${esc(q.contexte)}</div>
    <p class="muted" style="margin:8px 0 4px">L’énoncé est-il neutre, une seule idée, compréhensible, et le contexte exact ?</p>
    <div class="row" role="group" aria-label="Décision sur la question">
      <button class="v" data-q="ok" aria-pressed="${d.question === 'ok'}">Question correcte</button>
      <button class="c" data-q="reformuler" aria-pressed="${d.question === 'reformuler'}">À reformuler</button>
    </div>
    <div class="${d.question === 'reformuler' ? '' : 'hide'}" style="margin-top:8px">
      <textarea data-qf="enonce" placeholder="Formulation proposée">${esc(d.enonce || '')}</textarea>
      <textarea data-qf="note" placeholder="Motif (facultatif)" style="margin-top:6px">${esc(d.note || '')}</textarea>
    </div>
  </div>
  <div class="row" style="justify-content:space-between"><b>Positions des candidats</b><button id="allok">Valider toutes les positions non traitées</button></div>
  ${ps.length ? ps.map(posCard).join('') : '<div class="card muted">Aucune position citée pour cette question.</div>'}
  <div class="row"><button id="prev2">← Précédente</button><button id="next2" class="primary">Suivante →</button></div>`;
}

function go(n) { S.cur += n; save(); render(); window.scrollTo(0, 0); }
document.addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  const L = list(), q = L[S.cur];
  if (b.id === 'prev' || b.id === 'prev2') return go(-1);
  if (b.id === 'next' || b.id === 'next2') return go(1);
  if (b.id === 'export') return exportJson();
  if (b.id === 'import') return document.getElementById('file').click();
  if (!q) return;
  const d = dq(q.id);
  if (b.dataset.q) { d.question = d.question === b.dataset.q ? null : b.dataset.q; save(); return render(); }
  if (b.id === 'allok') { posOf(q.id).forEach((p) => { const x = (d.positions[p.candidat] ||= {}); if (!x.statut) x.statut = 'valide'; }); save(); return render(); }
  if (b.dataset.act) {
    const c = b.closest('[data-c]').dataset.c, x = (d.positions[c] ||= {});
    x.statut = x.statut === b.dataset.act ? null : b.dataset.act;
    if (x.statut === 'corrige' && x.score === undefined) x.score = posOf(q.id).find((p) => p.candidat === c).score;
    if (x.statut !== 'corrige') delete x.score;
    save(); render();
  }
});
document.addEventListener('change', (e) => {
  const q = list()[S.cur]; if (!q) return;
  if (e.target.id === 'filter') { S.cur = 0; return render(); }
  if (e.target.id === 'jump') { S.cur = +e.target.value; save(); return render(); }
  if (e.target.id === 'file') return importJson(e.target.files[0]);
  const d = dq(q.id), card = e.target.closest('[data-c]');
  if (e.target.dataset.f && card) { const x = (d.positions[card.dataset.c] ||= {}); x[e.target.dataset.f] = e.target.dataset.f === 'score' ? +e.target.value : e.target.value; save(); render(); }
});
document.addEventListener('input', (e) => {
  const q = list()[S.cur]; if (!q) return;
  const d = dq(q.id), card = e.target.closest('[data-c]');
  if (e.target.dataset.qf) { d[e.target.dataset.qf] = e.target.value; save(); }
  else if (e.target.dataset.f === 'note' && card) { (d.positions[card.dataset.c] ||= {}).note = e.target.value; save(); }
});

function exportJson() {
  const out = { version: 1, exporte_le: new Date().toISOString().slice(0, 10), questions: {} };
  for (const [id, d] of Object.entries(S.dec)) {
    const pos = {}; for (const [c, x] of Object.entries(d.positions)) if (x.statut) pos[c] = { statut: x.statut, ...(x.statut === 'corrige' ? { score: x.score } : {}), ...(x.note ? { note: x.note } : {}) };
    if (d.question || Object.keys(pos).length) out.questions[id] = { question: d.question, ...(d.question === 'reformuler' && d.enonce ? { enonce: d.enonce } : {}), ...(d.note ? { note: d.note } : {}), positions: pos };
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(out, null, 1)], { type: 'application/json' }));
  a.download = 'relecture.json'; a.click(); URL.revokeObjectURL(a.href);
}
async function importJson(f) {
  if (!f) return;
  try {
    const j = JSON.parse(await f.text()); if (!j.questions) throw 0;
    for (const [id, d] of Object.entries(j.questions)) S.dec[id] = { question: d.question || null, enonce: d.enonce || '', note: d.note || '', positions: d.positions || {} };
    save(); render();
  } catch { alert('Fichier non reconnu.'); }
}

(async () => {
  try {
    const [q, p, c, a] = await Promise.all(['questions', 'positions', 'candidats', 'axes'].map((n) => fetch('../data/' + n + '.json').then((r) => r.json())));
    Q = q; P = p; c.forEach((x) => (C[x.id] = x)); a.forEach((x) => (A[x.id] = x));
  } catch { document.getElementById('view').innerHTML = '<div class="card">Impossible de charger ../data. Lancez <code>python3 -m http.server</code> à la racine du projet et ouvrez /tools/relecture.html.</div>'; return; }
  const s = load(); if (s) S = { dec: s.dec || {}, cur: s.cur || 0 };
  render();
})();
</script>
</body>
</html>

name = "elysee-compteur"
main = "worker.js"
compatibility_date = "2025-01-01"
workers_dev = false   # pas d'adresse *.workers.dev : le Worker n'est joignable que sur le domaine
routes = [{ pattern = "api.elysee-2027.win", custom_domain = true }]

[vars]
ALLOWED_ORIGIN = "https://elysee-2027.github.io,https://elysee-2027.win,https://www.elysee-2027.win"

[[d1_databases]]
binding = "DB"
database_name = "elysee-compteur"
database_id = "26e30a1e-c89e-42b7-8a28-b2d59847b076"   # fourni par « wrangler d1 create elysee-compteur »

# Limitation de débit native (facultative) : 10 envois par minute et par adresse.
[[unsafe.bindings]]
name = "LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 10, period = 60 }
